{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
<div class="rbt-event-area rbt-section-gap bg-gradient-3">
    <div class="container">
        <div class="row mb--55">
            <div class="section-title text-center">
                <span class="subtitle bg-white-opacity">STIMULATED TO TAKE PART IN?</span>
                <h2 class="title color-white">Gallery</h2>
            </div>
        </div>

        <div class="row">
            {% for gallery_item in all_gallery %}
            <!-- Start Single Slide  -->
            <div class="col-4">
                <div class="single-slide">
                    <div class="rbt-card event-grid-card variation-01 rbt-hover">
                        <div class="rbt-card-img">
                            <a href="{% url "gallery-details" gallery_item.id %}">
                                <img src="{{gallery_item.image.url}}" alt="Card image">
                            </a>
                        </div>
                        <div class="rbt-card-body">
                            <h4 class="rbt-card-title"><a href="{% url "gallery-details" gallery_item.id %}">{{gallery_item.title}}</a></h4>

                        </div>
                    </div>
                </div>
            </div>
            <!-- End Single Slide  -->
            {% endfor %}

        </div>


    </div>
</div>
{% endblock content %}
