{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
<!-- Start Testimonial Area   -->
<div class="rbt-testimonial-area bg-color-white rbt-section-gap overflow-hidden">
    <div class="wrapper">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="section-title text-center mb--10">
                        <span class="subtitle bg-primary-opacity">EDUCATION FOR EVERYONE</span>
                        <h2 class="title">Students Love Cerebral Heights. <br />
                        </h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
        <div class="row">
            {% for review_item in all_review %}
            <!-- Start Single Testimonial  -->
            <div class="col-4">
                <div class="rbt-testimonial-box style-2">
                    <div class="inner">
                        <div class="description">
                            <p class="subtitle-3">{{review_item.text}}</p>
                            <div class="clint-info-wrapper">
                                <div class="thumb">
                                    <img src="{{review_item.image.url}}" alt="Clint Images">
                                </div>
                                <div class="client-info">
                                    <h5 class="title">{{review_item.name}}</h5>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End Single Testimonial  -->
            {% endfor %}
        </div>

</div>
<!-- End Testimonial Area   -->
{% endblock content %}
